[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "0.1.0"
description = "Enterprise-style RAG chatbot with LangGraph, FAISS, and PII guardrails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "faiss-cpu>=1.8.0",
    "langgraph>=0.2",
    "langchain>=0.2",
    "langchain-core>=0.2",
    "sentence-transformers>=3.0.0",
    "langchain-google-genai>=1.0",
    "arize-phoenix-otel>=0.1.0",
    "arize-phoenix[evals]>=0.1.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
ragbot = "ragbot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
